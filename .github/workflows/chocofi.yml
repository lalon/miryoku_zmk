# Chocofi (Corne-compatible, 36 keys) with nice!nano v2, Miryoku QWERTY
name: 'Chocofi nice_nano_v2 QWERTY'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano//zmk"]'
      shield: '["corne_left","corne_right"]'
      alphas: '["QWERTY"]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
  settings_reset:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano//zmk"]'
      shield: '["settings_reset"]'
